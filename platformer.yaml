# mauimallard — DONALD STARRING IN MAUI MALLARD
# СГЕНЕРИРОВАНО tools/analyze.py — правки затираются, меняйте анализатор.
# Границы кода получены обходом по потоку управления (векторы + прологи
# функций) внутри окон $28D000-$2AC000 $2F8000-$2F9000, а не разметкой на глаз. В m68k попадает только
# подтверждённый код, всё непокрытое вынесено в bin: только начало нового
# сегмента возвращает дизассемблеру выравнивание.
name: mauimallard
sha1: "87268858DE20721417E050C1097955EEFDBD5298"

options:
  platform: megadrive
  region: ntsc
  basename: mauimallard
  base_path: ./out/mauimallard
  target_path: ./platformer.gen
  asm_path: asm
  asset_path: assets
  build_path: build
  symbols_path: ./platformer_symbols.txt
  header_output: true
  incbin: true

segments:
