  # Шесть окон по 32 КБ, которые драйвер Z80 подключает регистром $6000.
  # Номер банка v из таблиц $001F36 и $00201C даёт адрес $1C0000 + v*$8000
  # (вывод — в docs/game-sound.md). Банки 2..4 держат музыку, 5..7 — DAC.
  # Границы внутри банков 5..7 взяты не на глаз: таблица сэмплов в начале
  # окна перечисляет длины, и они укладываются встык до последнего байта.
  - name: data_music_b2
    type: bin
    start: 0x1D0000
    end:   0x1D8000
    subdir: rom_data

