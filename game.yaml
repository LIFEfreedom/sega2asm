# Dyna Brothers 2 - Sega Channel Special (Japan)
# CRI, 1995.APR — GM T-68063-00 — регион J — 2 621 440 байт (0x280000)
# SRAM: $200001-$203FFF (odd bytes); контрольная сумма заголовка сходится
name: dynabrothers2
sha1: "8E10298DFFF521397F0E82D1787E701D6928750B"

options:
  platform: megadrive
  region: ntsc
  basename: dynabrothers2
  base_path: ./out
  target_path: ./game.gen
  asm_path: asm
  asset_path: assets
  build_path: build
  symbols_path: ./game_symbols.txt
  charmap_path: ./game_charmap.tbl   # пока не создан, это допустимо
  header_output: true
  incbin: true

# ── Границы получены обходом по потоку управления, а не на глаз ───────────
# Засев: 53 точки (таблица векторов + 62 записи таблицы line-F $6BC),
# затем прологи функций (48E7 movem.l / 4E56 link a6) для подпрограмм,
# достижимых только косвенными вызовами.
# Итог: 59 163 инструкции, 223 528 байт кода. Код кончается на $061B4E —
# дальше 93 362 байта 0xFF. Последние инструкции перед границей:
#   4C DF 0F 0F  movem.l (sp)+,d0-d3/a0-a3
#   4E 75        rts
# За границей во всей остальной ROM (2.2 МБ) обход находит 72 байта в
# 4 обрывках по 10-30 байт — ложные срабатывания внутри графики. Кода там нет.
#
# ВАЖНО: hints НЕ ресинхронизируют дизассемблер — линейный проход считается
# заранее, подсказка лишь подавляет вывод (segments/code.go:120-131). Поэтому
# блоки данных вынесены в отдельные сегменты `bin`: только начало нового
# сегмента возвращает декодеру выравнивание.
segments:
  # Заголовок ROM + таблица векторов 68000
  - name: header
    type: header
    start: 0x000000
    end:   0x000200

  # Обработчики исключений и прерываний
  - name: vector_handlers
    type: m68k
    start: 0x000200
    end:   0x0006BC

  # Таблица переходов диспетчера line-F ($000694):
  #   move.w ($12,pc,d0.w),d0 / lea ($E,pc,d0.w),a0  ->  база $0006BC.
  # Через эти трапы игра зовёт свой BIOS; в выводе они остаются как dc.w $FFxx.
  - name: linef_jumptable
    type: m68k
    start: 0x0006BC
    end:   0x000738
    hints:
      - offset: 0x0000
        type: ptr_table_rel
        length: 0x7C
        base:  0x0006BC
        label: LineFJumpTable

  # ── Код и данные $000738-$061B4E ────────────────────────────────────────
  # Блоки данных >= 0x800 байт вырезаны в `bin`; между ними — код.
  # плотность кода по обходу: 89.4%
  - name: code_01
    type: m68k
    start: 0x000738
    end:   0x00220E

  # плотность кода по обходу: 0.0%
  - name: data_01
    type: bin
    start: 0x00220E
    end:   0x003A0C
    subdir: code_data

  # плотность кода по обходу: 68.2%
  - name: code_02
    type: m68k
    start: 0x003A0C
    end:   0x00E916

  # плотность кода по обходу: 0.0%
  - name: data_02
    type: bin
    start: 0x00E916
    end:   0x00F6C6
    subdir: code_data

  # плотность кода по обходу: 97.9%
  - name: code_03
    type: m68k
    start: 0x00F6C6
    end:   0x00FB92

  # плотность кода по обходу: 0.0%
  - name: data_03
    type: bin
